[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-roi"
version = "2.0.0"
description = "Enterprise policy, identity, approval, audit, observability, adapters, and realized-ROI controls for agentic workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tarek" }]
dependencies = ["PyYAML>=6.0.3,<7"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
identity = ["PyJWT[crypto]>=2.13.0,<3"]
control-plane = [
  "fastapi>=0.140.0,<1",
  "uvicorn>=0.51.0,<1",
  "PyJWT[crypto]>=2.13.0,<3",
]
observability = [
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
]
postgres = ["psycopg[binary]>=3.3.4,<4"]
aws = ["boto3>=1.43.56,<2"]
azure = ["azure-keyvault-keys>=4.11.1,<5", "azure-identity>=1.25.3,<2"]
gcp = ["google-cloud-kms>=3.16.0,<4", "cryptography>=49.0.0,<50"]
enterprise = [
  "fastapi>=0.140.0,<1",
  "uvicorn>=0.51.0,<1",
  "PyJWT[crypto]>=2.13.0,<3",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "psycopg[binary]>=3.3.4,<4",
  "boto3>=1.43.56,<2",
  "azure-keyvault-keys>=4.11.1,<5",
  "azure-identity>=1.25.3,<2",
  "google-cloud-kms>=3.16.0,<4",
  "cryptography>=49.0.0,<50",
]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "build>=1.5.0,<2",
  "fastapi>=0.140.0,<1",
  "uvicorn>=0.51.0,<1",
  "PyJWT[crypto]>=2.13.0,<3",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "pytest-asyncio>=1.4.0,<2",
  "httpx2>=2.9.1,<3",
  "twine>=6.2.0,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
agent-roi = "agent_roi.cli.sentinel:main"
agent-roi-control-plane = "agent_roi.cli.control_plane:main"
agent-roi-db = "agent_roi.cli.database:main"
agent-roi-outbox = "agent_roi.cli.outbox:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_roi = ["policies/*.yaml", "migrations/postgres/*.sql", "py.typed"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  'ignore:websockets\.legacy is deprecated:DeprecationWarning:websockets\.legacy',
  'ignore:websockets\.server\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\.protocols\.websockets\.websockets_impl',
]
[tool.coverage.run]
branch = true
source = ["agent_roi"]

[tool.coverage.report]
fail_under = 98.0
precision = 2
show_missing = true
skip_covered = true

