apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-roi.name" . }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "agent-roi.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ include "agent-roi.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["agent-roi-db", "migrate"]
          env:
            - name: AGENT_ROI_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.dsnSecretName }}
                  key: {{ .Values.postgres.dsnSecretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
