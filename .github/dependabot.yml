version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deployment/docker
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /deployment/terraform/aws
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /deployment/terraform/azure
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /deployment/terraform/gcp
    schedule:
      interval: monthly
