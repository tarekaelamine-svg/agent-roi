name: Publish Python release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify tag and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,enterprise]"
          python -m pip install build twine
          python -m pip check
          python scripts/verify_release.py --expected-tag "${GITHUB_REF_NAME}"
          pytest --cov=agent_roi --cov-branch --cov-fail-under=98
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py --dist-dir dist --expected-tag "${GITHUB_REF_NAME}"
          mkdir -p release-output
          sha256sum dist/* > release-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: release-output/SHA256SUMS.txt
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-roi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: release-checksums
          path: release-output
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          release-output/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Agent-ROI ${GITHUB_REF_NAME#v}"
