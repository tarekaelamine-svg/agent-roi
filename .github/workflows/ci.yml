name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test with enforced coverage
        run: >-
          pytest
          --cov=agent_roi
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=98
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Validate release metadata
        run: python scripts/verify_release.py --dist-dir dist
      - name: Install wheel in clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(find dist -name '*.whl' -print -quit)"
          .wheel-venv/bin/python -m pip install "${WHEEL}[enterprise]"
          .wheel-venv/bin/python -m pip check
          .wheel-venv/bin/agent-roi --version
          .wheel-venv/bin/agent-roi-control-plane --version
          .wheel-venv/bin/agent-roi-db --help >/dev/null
          .wheel-venv/bin/agent-roi-outbox --help >/dev/null
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
